name: Build and Deploy LaTeX Book

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5 # Upgraded to v5 to fix Node.js deprecation warning

      - name: Compile LaTeX document - Pass 1
        uses: xu-cheng/latex-action@v4
        with:
          root_file: zongjie.tex
          latexmk_use_xelatex: true
          args: "-v -pdfxe -latexoption=-file-line-error -latexoption=-interaction=nonstopmode -latexoption=-shell-escape"

      - name: Compile LaTeX document - Pass 2 (Regenerate Refs & ToC)
        uses: xu-cheng/latex-action@v4
        with:
          root_file: zongjie.tex
          latexmk_use_xelatex: true
          args: "-v -pdfxe -latexoption=-file-line-error -latexoption=-interaction=nonstopmode -latexoption=-shell-escape"

      - name: Move PDF to deployment folder
        run: |
          mkdir public
          mv zongjie.pdf public/index.pdf
          # Creates an automatic redirect page so the main link doesn't show a 404 error
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=index.pdf"></head><body><p>Redirecting to book PDF... If it does not load, <a href="index.pdf">click here</a>.</p></body></html>' > public/index.html

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4 # Keeps v4 (already handles Node runtime upgrades)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
